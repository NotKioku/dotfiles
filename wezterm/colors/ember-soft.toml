# Ember — lifted dark variant

[colors]
foreground = "#d8d0c0"
background = "#242320"
cursor_bg = "#e08060"
cursor_border = "#e08060"
cursor_fg = "#242320"
selection_bg = "#3a3836"
selection_fg = "#d8d0c0"

ansi = ["#1c1b19","#e08060","#8a9868","#c8b468","#7890a0","#b07878","#80a090","#d8d0c0"]
brights = ["#1c1b19","#e08060","#8a9868","#c8b468","#7890a0","#b07878","#80a090","#d8d0c0"]

[colors.tab_bar]
background = "#242320"

[colors.tab_bar.active_tab]
bg_color = "#585550"
fg_color = "#d8d0c0"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab]
bg_color = "#2a2927"
fg_color = "#b0a898"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#585550"
fg_color = "#d8d0c0"
intensity = "Normal"
italic = true
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab]
bg_color = "#242320"
fg_color = "#b0a898"
intensity = "Normal"
italic = false
strikethrough = false
underline = "None"

[colors.tab_bar.new_tab_hover]
bg_color = "#585550"
fg_color = "#d8d0c0"
intensity = "Normal"
italic = true
strikethrough = false
underline = "None"
